[package]
name = "sharesomething"
version = "0.1.0"
description = "Self-hosted sharing of text, links, credentials and files with per-share security"
repository = "https://github.com/mnj/ShareSomething"
edition = "2024"
license = "MIT"

[[bin]]
name = "sharesomething"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
hkdf = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
ipnet = "2"
mime_guess = "2"
openidconnect = "4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
futures-util = "0.3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
tower-http = { version = "0.6", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
webauthn-rs = "0.5"
# webauthn-rs needs OpenSSL; vendor it so the musl/distroless binary stays fully static.
openssl = { version = "0.10", features = ["vendored"] }
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }
chrono = "0.4"
futures = "0.3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
