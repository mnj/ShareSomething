# ShareSomething configuration. Copy to config.toml and pass with --config / SS_CONFIG.
# Every key can also be set via environment: SS_<KEY>, nested with "__"
# (e.g. SS_BASE_URL, SS_PROXY__MODE, SS_PROXY__TRUSTED_PROXIES="172.30.0.0/24,127.0.0.1").

# single: one owner (self-hosting for yourself). team: several users with roles (admin, member,
# auditor). Team sign-up/invites and SSO arrive in a later release; until then use `admin init`.
mode = "single"

bind = "0.0.0.0:8080"
# Public URL people use. Builds share links and is checked against the Origin header.
# Cookies are marked Secure automatically when this is https.
# Owner passkeys need a domain name here (https://..., or http://localhost for development).
base_url = "https://share.example.com"
data_dir = "./data"

# Base64 32-byte key that wraps server-side encryption keys. If unset, one is generated in
# data_dir/master.key on first start. Back it up: losing it makes server-mode shares unreadable.
# Generate: openssl rand -base64 32
# master_key = ""

session_ttl_hours = 168
max_text_bytes = 1048576
# Burned/expired/revoked shares stay on the dashboard this long before being purged.
retention_days = 7
# Wrong passphrase attempts before a share is destroyed.
max_passphrase_attempts = 10

# File shares
max_upload_bytes = 1073741824   # total per share (1 GiB); recipients download into browser memory
max_files = 100
download_ttl_mins = 60          # how long a recipient can keep downloading after opening

# How long a recipient stays signed in after an email code / OIDC login.
recipient_session_hours = 12

[proxy]
# none       - use the TCP peer address (app exposed directly)
# cloudflare - trust CF-Connecting-IP / CF-IPCountry (cloudflared tunnel or Cloudflare proxy)
# forwarded  - trust X-Forwarded-For / Forwarded (Caddy, nginx, Traefik)
mode = "none"
# Only these peers may supply the headers above. Keep this as narrow as possible:
# the docker network of your tunnel/proxy, or 127.0.0.1 when it runs on the host.
trusted_proxies = []

[slugs]
# Link styles: shortcode, words, pronounceable, uuid, template, custom. Empty = all.
enabled = []
default = "shortcode"
# Optional wordlist (one lowercase a-z word per line, at least 256) for the "words" style.
# words_file = "/data/words.txt"

# Email one-time codes for recipients (policy rules "Emails" / "Email domain").
[email]
mode = "disabled"            # disabled | log (codes go to the server log; dev only) | smtp
from = "ShareSomething <share@example.com>"
smtp_host = "smtp.example.com"
smtp_port = 587
smtp_tls = "starttls"        # starttls | tls | none
smtp_username = "share@example.com"
smtp_password = ""

# Recipient sign-in providers. Redirect URI to register with each provider:
#   <base_url>/api/recipient/oidc/<id>/callback
# Policy rules can require a specific one ("oidc:<id>") or accept any.
# Via env: SS_OIDC='[{id="google",name="Google",issuer="https://accounts.google.com",client_id="…",client_secret="…"}]'

# [[oidc]]
# id = "google"
# name = "Google"
# issuer = "https://accounts.google.com"
# client_id = ""
# client_secret = ""

# [[oidc]]
# id = "microsoft"
# name = "Microsoft"
# issuer = "https://login.microsoftonline.com/<tenant-id>/v2.0"
# client_id = ""
# client_secret = ""
# scopes = ["email", "profile"]
# # Entra ID often omits email_verified; only enable this for a tenant you control.
# trust_unverified_email = true

# [[oidc]]
# id = "github"
# name = "GitHub"
# kind = "github"             # OAuth app; uses the account's verified emails
# client_id = ""
# client_secret = ""

